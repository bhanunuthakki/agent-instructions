name: Public Boundary

on:
  pull_request:
  push:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    if: github.event_name != 'schedule'
    name: Public Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Reject tracked private operational state
        run: python snippets/check_public_boundary.py

  all-public-refs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: All Public Refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: bash scripts/audit_public_refs.sh
